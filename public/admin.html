<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portal Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080d;--p1:#11111a;--p2:#171724;--ln:#262638;--tx:#f1f1fa;--mu:#9494b0;--ac:#7c7cff;--ac2:#9a9aff;--ok:#3ddc97;--wn:#ffb84d;--er:#ff5a8c;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:500 14px/1.45 Outfit,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--p2);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);border-color:var(--ac);color:#0b0b14;font-weight:700}button.pri:disabled{opacity:.4;cursor:default}
button.bad{border-color:#5a2338;color:var(--er)}button.lnk{border:0;background:none;padding:2px 6px;color:var(--ac2);font-size:12px}
input[type=text],input[type=password],input[type=number],input[type=search],input[type=datetime-local],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}textarea{resize:vertical;min-height:60px}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:12px 18px;background:rgba(8,8,13,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.brand{font-weight:700;font-size:18px;white-space:nowrap}.brand b{color:var(--ac2)}.sp{flex:1}.top input{max-width:280px}
.st{color:var(--mu);font-size:13px;white-space:nowrap}.st.d{color:var(--wn)}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 60px)}
nav{border-right:1px solid var(--ln);padding:14px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow:auto}
nav button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;color:var(--mu)}
nav button:hover{background:var(--p1);color:var(--tx)}nav button.on{background:var(--p2);color:var(--tx)}
nav .sep{height:1px;background:var(--ln);margin:10px 4px}nav small{color:var(--ac2);font-weight:700}
main{padding:24px;max-width:980px;width:100%}
h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 10px}.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile .k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.tile .v{font-size:20px;font-weight:700;margin-top:4px;word-break:break-word}
.on-v{color:var(--er)}.off-v{color:var(--ok)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 56px;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--ln)}
.row.wide{grid-template-columns:1fr 56px}.row.wide .meta{grid-column:1/2}.row.wide .ctl{grid-column:1/2;grid-row:2}.row.wide .rs{grid-column:2;grid-row:1}
.lbl{font-weight:600;display:flex;gap:8px;align-items:center}.hint{color:var(--mu);font-size:13px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);display:inline-block}.dot[hidden],.rs button[hidden]{display:none}
.tg{position:relative;display:inline-block;width:46px;height:26px}.tg input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.tg span{position:absolute;inset:0;background:var(--ln);border-radius:20px;transition:.15s}.tg span:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tg input:checked+span{background:var(--ac)}.tg input:checked+span:after{transform:translateX(20px)}
.tags{display:flex;flex-wrap:wrap;gap:6px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:6px}
.tags input{flex:1;min-width:140px;border:0;background:none;outline:0;padding:4px 6px}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--p2);border-radius:8px;padding:3px 4px 3px 10px}.tag button{border:0;background:none;padding:0 6px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{display:flex;gap:6px;align-items:center;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:6px 12px;cursor:pointer}
.mrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.item{display:grid;gap:8px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.item.a{grid-template-columns:1fr 1.4fr 150px auto}.acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.ok{background:rgba(61,220,151,.15);color:var(--ok)}.warn{background:rgba(255,184,77,.15);color:var(--wn)}.fail{background:rgba(255,90,140,.15);color:var(--er)}
.res{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}.res small{color:var(--mu)}
.lst{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}.lst .n{flex:1;min-width:0}.lst small{color:var(--mu);display:block}
.login{max-width:360px;margin:16vh auto;padding:0 18px}.login .card{display:grid;gap:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:11px 18px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}#toast.on{opacity:1}#toast.e{border-color:var(--er);color:var(--er)}
html[data-t=light]{--bg:#f4f4fb;--p1:#fff;--p2:#ececf8;--ln:#d8d8ea;--tx:#15151f;--mu:#62627a;--ac:#5a5af0;--ac2:#4a4ad8;color-scheme:light}
html[data-t=light] .top{background:rgba(244,244,251,.92)}html[data-t=light] button.pri{color:#fff}
.ro .ctl,.ro .quick{pointer-events:none;opacity:.55}.ro #pub,.ro #dis{display:none}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}.mod .card{max-width:680px;width:100%;max-height:86vh;overflow:auto;display:grid;gap:12px}
.diff{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;border-bottom:1px solid var(--ln);padding:6px 0;word-break:break-all}.diff .o{color:var(--er)}.diff .n{color:var(--ok)}
.warnbox{border-left:4px solid var(--wn);padding:8px 12px;background:var(--p2);border-radius:8px;margin-bottom:8px}
input[type=color]{width:56px;height:38px;padding:2px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);cursor:pointer}
table.t{width:100%;border-collapse:collapse}table.t td{padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}table.t tr.blk td{opacity:.5}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:4px;overflow:auto;border-right:0;border-bottom:1px solid var(--ln)}nav button{white-space:nowrap;width:auto}nav .sep{display:none}.row{grid-template-columns:1fr 56px}.row .ctl{grid-column:1;grid-row:2}.item.a{grid-template-columns:1fr}.top{flex-wrap:wrap}.top input{max-width:none;order:9;flex-basis:100%}main{padding:16px}.res{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const SCHEMA=[{"k":"lockdown","g":"Lockdown","h":"true = cover the whole portal with a lock screen","d":false,"t":"bool","l":"Lockdown"},{"k":"lockdownTitle","g":"Lockdown","h":"","d":"Portal locked","t":"str","l":"Lockdown Title"},{"k":"lockdownMessage","g":"Lockdown","h":"","d":"This portal is locked right now. Please check with your teacher.","t":"text","l":"Lockdown Message"},{"k":"lockdownFrom","g":"Lockdown","h":"optional start, like \"2026-10-20T08:00\" (blank = starts now)","d":"","t":"dt","l":"Lockdown From"},{"k":"lockdownUntil","g":"Lockdown","h":"optional end,   like \"2026-10-20T14:30\" (blank = never ends)","d":"","t":"dt","l":"Lockdown Until"},{"k":"lockdownShowHelp","g":"Lockdown","h":"keep a Call or text 988 button on the lock screen","d":true,"t":"bool","l":"Lockdown Show Help"},{"k":"testingMode","g":"Testing mode","h":"true = turn testing mode on","d":false,"t":"bool","l":"Testing Mode"},{"k":"testingTabs","g":"Testing mode","h":"tabs that stay open: apps, tools, plan, cal, school, courses, ath, help, settings","d":["tools"],"t":"multi","o":["apps","tools","plan","cal","school","courses","ath","help","settings"],"l":"Testing Tabs"},{"k":"testingHideTools","g":"Testing mode","h":"tools hidden while testing (exact tool names)","d":["Quick notes","Citation maker","Word counter","Flashcards"],"t":"list","l":"Testing Hide Tools"},{"k":"testingAllowedApps","g":"Testing mode","h":"apps that stay open while testing, like [\"Desmos\",\"Canvas\"]","d":[],"t":"list","l":"Testing Allowed Apps"},{"k":"testingMessage","g":"Testing mode","h":"","d":"Testing mode is on. Only approved tools are available.","t":"text","l":"Testing Message"},{"k":"testingShowBanner","g":"Testing mode","h":"show the testing message at the bottom","d":true,"t":"bool","l":"Testing Show Banner"},{"k":"testingBlockApps","g":"Testing mode","h":"block apps (except testingAllowedApps)","d":true,"t":"bool","l":"Testing Block Apps"},{"k":"testingBlockLinks","g":"Testing mode","h":"block outside links","d":true,"t":"bool","l":"Testing Block Links"},{"k":"testingBlockShortcuts","g":"Testing mode","h":"turn off keyboard shortcuts","d":true,"t":"bool","l":"Testing Block Shortcuts"},{"k":"testingBlockQuickFind","g":"Testing mode","h":"turn off Quick find","d":true,"t":"bool","l":"Testing Block Quick Find"},{"k":"testingBlockThemes","g":"Testing mode","h":"block theme changes","d":true,"t":"bool","l":"Testing Block Themes"},{"k":"testingBlockCopyPaste","g":"Testing mode","h":"block copy, cut, paste and right-click","d":true,"t":"bool","l":"Testing Block Copy Paste"},{"k":"banner","g":"Site-wide controls","h":"message shown on every page (\"\" = none)","d":"","t":"text","l":"Banner"},{"k":"bannerTop","g":"Site-wide controls","h":"true = show the banner at the top instead of the bottom","d":false,"t":"bool","l":"Banner Top"},{"k":"bannerDismissible","g":"Site-wide controls","h":"true = students can close the banner (until they reopen the page)","d":false,"t":"bool","l":"Banner Dismissible"},{"k":"noApps","g":"Site-wide controls","h":"true = apps cannot be opened","d":false,"t":"bool","l":"No Apps"},{"k":"noLinks","g":"Site-wide controls","h":"true = every outside link is blocked","d":false,"t":"bool","l":"No Links"},{"k":"blockedApps","g":"Site-wide controls","h":"apps removed completely, like [\"YouTube\",\"Netflix\"]","d":[],"t":"list","l":"Blocked Apps"},{"k":"blockedSites","g":"Site-wide controls","h":"sites blocked, like [\"tiktok.com\"] (removes matching apps and blocks links)","d":[],"t":"list","l":"Blocked Sites"},{"k":"hiddenCategories","g":"Site-wide controls","h":"app categories hidden, like [\"News\"]","d":[],"t":"list","l":"Hidden Categories"},{"k":"disabledTools","g":"Site-wide controls","h":"single tools hidden, like [\"Typing test\"]","d":[],"t":"list","l":"Disabled Tools"},{"k":"warnBeforeLeaving","g":"Site-wide controls","h":"true = ask \"Leave the portal?\" before any outside link","d":false,"t":"bool","l":"Warn Before Leaving"},{"k":"disableRightClick","g":"Site-wide controls","h":"true = block the right-click menu","d":false,"t":"bool","l":"Disable Right Click"},{"k":"disableTextSelection","g":"Site-wide controls","h":"true = text cannot be selected (typing boxes still work)","d":false,"t":"bool","l":"Disable Text Selection"},{"k":"idleScreenMinutes","g":"Site-wide controls","h":"show a \"Still there?\" screen after this many idle minutes (0 = off)","d":0,"t":"num","l":"Idle Screen Minutes"},{"k":"idleScreenMessage","g":"Site-wide controls","h":"","d":"Are you still there? Tap Continue to keep using the portal.","t":"text","l":"Idle Screen Message"},{"k":"forceSameTab","g":"Site-wide controls","h":"true = apps open in the same tab","d":false,"t":"bool","l":"Force Same Tab"},{"k":"forcedTheme","g":"Site-wide controls","h":"lock the theme, like \"dark\" or \"light\" (blank = students choose)","d":"","t":"select","o":["","dark","light"],"l":"Forced Theme"},{"k":"startTab","g":"Site-wide controls","h":"tab that opens first: apps, tools, plan, cal, school, courses, ath, help, settings (blank = last used)","d":"","t":"select","o":["","apps","tools","plan","cal","school","courses","ath","help","settings"],"l":"Start Tab"},{"k":"portalName","g":"Site-wide controls","h":"rename the portal, like \"Raider Hub\" (blank = Raider Portal)","d":"","t":"str","l":"Portal Name"},{"k":"greetingText","g":"Site-wide controls","h":"replaces \"Every school tool you need, one click away.\"","d":"","t":"text","l":"Greeting Text"},{"k":"tabApps","g":"Tabs","h":"","d":true,"t":"bool","l":"Tab Apps"},{"k":"tabTools","g":"Tabs","h":"","d":true,"t":"bool","l":"Tab Tools"},{"k":"tabPlanner","g":"Tabs","h":"","d":true,"t":"bool","l":"Tab Planner"},{"k":"tabCalendar","g":"Tabs","h":"","d":true,"t":"bool","l":"Tab Calendar"},{"k":"tabSchoolInfo","g":"Tabs","h":"","d":true,"t":"bool","l":"Tab School Info"},{"k":"tabCourses","g":"Tabs","h":"","d":true,"t":"bool","l":"Tab Courses"},{"k":"tabAthletics","g":"Tabs","h":"","d":true,"t":"bool","l":"Tab Athletics"},{"k":"tabCounseling","g":"Tabs","h":"","d":true,"t":"bool","l":"Tab Counseling"},{"k":"tabSettings","g":"Tabs","h":"","d":true,"t":"bool","l":"Tab Settings"},{"k":"toolTimers","g":"Tool groups","h":"Study timer, Stopwatch, Countdowns","d":true,"t":"bool","l":"Tool Timers"},{"k":"toolGradeCalculators","g":"Tool groups","h":"Grade calculator, GPA calculator, Final exam calculator","d":true,"t":"bool","l":"Tool Grade Calculators"},{"k":"toolMathCalculators","g":"Tool groups","h":"Scientific, Quadratic, Stats, GCF and LCM, Percent, Base converter, Roman numerals","d":true,"t":"bool","l":"Tool Math Calculators"},{"k":"toolConvertersAndDates","g":"Tool groups","h":"Unit converter, Date calculator","d":true,"t":"bool","l":"Tool Converters And Dates"},{"k":"toolWritingHelpers","g":"Tool groups","h":"Word counter, Citation maker, Text tools, Typing test","d":true,"t":"bool","l":"Tool Writing Helpers"},{"k":"toolOrganizers","g":"Tool groups","h":"To-do list, Quick notes, Flashcards","d":true,"t":"bool","l":"Tool Organizers"},{"k":"toolRandomAndSecurity","g":"Tool groups","h":"Randomizer, Password maker","d":true,"t":"bool","l":"Tool Random And Security"},{"k":"toolColor","g":"Tool groups","h":"Color tools","d":true,"t":"bool","l":"Tool Color"},{"k":"homeHeroTitle","g":"Apps home page","h":"big Raider Portal title","d":true,"t":"bool","l":"Home Hero Title"},{"k":"homeGreeting","g":"Apps home page","h":"greeting line","d":true,"t":"bool","l":"Home Greeting"},{"k":"homeCounters","g":"Apps home page","h":"Apps / Categories / Courses numbers","d":true,"t":"bool","l":"Home Counters"},{"k":"homeSearchBox","g":"Apps home page","h":"search box (also turns off the / shortcut)","d":true,"t":"bool","l":"Home Search Box"},{"k":"homeTypingPlaceholder","g":"Apps home page","h":"animated text in the search box","d":true,"t":"bool","l":"Home Typing Placeholder"},{"k":"homeCategoryBar","g":"Apps home page","h":"category chips","d":true,"t":"bool","l":"Home Category Bar"},{"k":"homePinnedApps","g":"Apps home page","h":"Pin buttons and the Pinned row","d":true,"t":"bool","l":"Home Pinned Apps"},{"k":"homeRecentApps","g":"Apps home page","h":"Recently opened row","d":true,"t":"bool","l":"Home Recent Apps"},{"k":"homeViewToggle","g":"Apps home page","h":"Grid / List button","d":true,"t":"bool","l":"Home View Toggle"},{"k":"topBrand","g":"Top bar and page extras","h":"name at the left of the top bar","d":true,"t":"bool","l":"Top Brand"},{"k":"topTabBar","g":"Top bar and page extras","h":"the row of tabs","d":true,"t":"bool","l":"Top Tab Bar"},{"k":"topQuickFind","g":"Top bar and page extras","h":"Quick find button and Ctrl K","d":true,"t":"bool","l":"Top Quick Find"},{"k":"topThemeMenu","g":"Top bar and page extras","h":"Themes button","d":true,"t":"bool","l":"Top Theme Menu"},{"k":"backToTopButton","g":"Top bar and page extras","h":"floating Top button","d":true,"t":"bool","l":"Back To Top Button"},{"k":"scrollProgressBar","g":"Top bar and page extras","h":"thin progress bar","d":true,"t":"bool","l":"Scroll Progress Bar"},{"k":"loadingScreen","g":"Top bar and page extras","h":"intro loading screen","d":true,"t":"bool","l":"Loading Screen"},{"k":"keyboardShortcuts","g":"Top bar and page extras","h":"every keyboard shortcut","d":true,"t":"bool","l":"Keyboard Shortcuts"},{"k":"animations","g":"Visual effects","h":"motion across pages, cards and hovers","d":true,"t":"bool","l":"Animations"},{"k":"floatingParticles","g":"Visual effects","h":"drifting dots","d":true,"t":"bool","l":"Floating Particles"},{"k":"backgroundGlow","g":"Visual effects","h":"soft colored lights","d":true,"t":"bool","l":"Background Glow"},{"k":"cardTilt3D","g":"Visual effects","h":"app cards lean toward the cursor","d":true,"t":"bool","l":"Card Tilt3 D"},{"k":"frostedBlur","g":"Visual effects","h":"frosted glass blur","d":true,"t":"bool","l":"Frosted Blur"},{"k":"rippleEffect","g":"Visual effects","h":"ripple when a button is pressed","d":true,"t":"bool","l":"Ripple Effect"},{"k":"appAddresses","g":"Visual effects","h":"site name under each app","d":true,"t":"bool","l":"App Addresses"},{"k":"settingsThemes","g":"Settings tab sections","h":"","d":true,"t":"bool","l":"Settings Themes"},{"k":"settingsEffects","g":"Settings tab sections","h":"","d":true,"t":"bool","l":"Settings Effects"},{"k":"settingsPersonalize","g":"Settings tab sections","h":"","d":true,"t":"bool","l":"Settings Personalize"},{"k":"settingsData","g":"Settings tab sections","h":"","d":true,"t":"bool","l":"Settings Data"},{"k":"settingsAbout","g":"Settings tab sections","h":"","d":true,"t":"bool","l":"Settings About"},{"k":"settingsShortcutsList","g":"Settings tab sections","h":"","d":true,"t":"bool","l":"Settings Shortcuts List"},{"k":"calendarMyEvents","g":"Extra features","h":"add your own calendar events","d":true,"t":"bool","l":"Calendar My Events"},{"k":"athleticsMyGames","g":"Extra features","h":"My games section","d":true,"t":"bool","l":"Athletics My Games"},{"k":"courseSaving","g":"Extra features","h":"Save button and Saved only filter","d":true,"t":"bool","l":"Course Saving"},{"k":"plannerStats","g":"Extra features","h":"stat tiles and progress bar","d":true,"t":"bool","l":"Planner Stats"},{"k":"counselingCrisisCard","g":"Extra features","h":"\"Need help right now?\" card","d":true,"t":"bool","l":"Counseling Crisis Card"},{"k":"schoolTermsTable","g":"Extra features","h":"2026-2027 calendar table","d":true,"t":"bool","l":"School Terms Table"},{"k":"confirmBeforeOpen","g":"Sites and links","h":"ask \"Open in a new tab?\" before a site opens (students can switch it off in Settings)","d":true,"t":"bool","l":"Confirm Before Open"},{"k":"confirmMessage","g":"Sites and links","h":"your own message. Use {site} for the site name. Empty = the default message","d":"","t":"text","l":"Confirm Message"},{"k":"confirmSkipSites","g":"Sites and links","h":"sites that never ask first, like [\"classroom.google.com\"]","d":[],"t":"list","l":"Confirm Skip Sites"},{"k":"settin   (need?code:p).focus();
}
async function start(){
  try{await load(false);S.view='dash';render()}catch(e){if(e.message!=='Signed out')showLogin(e.message)}
}
addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
let gp=false;
addEventListener('keydown',e=>{
  const t=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if(!$('.top'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();review();return}
  if(typing)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo(e.shiftKey?1:-1);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();undo(1);return}
  if(e.key==='/'){e.preventDefault();$('#sq').focus();return}
  if(gp){gp=false;const m={d:'dash',p:'presets',h:'history',c:'checks',a:'apps',n:'notes',r:'raw'}[e.key];if(m)go(m);return}
  if(e.key==='g')gp=true;
});
try{const th=localStorage.getItem('rp_admin_t');if(th)document.documentElement.dataset.t=th}catch(e){}
start();
